name: Release

# Erstellt ein GitHub-Release mit den Notizen aus CHANGELOG.md:
# - automatisch, sobald ein Tag wie v0.1.0 gepusht wird, oder
# - von Hand unter "Actions" → "Release" → "Run workflow" mit der Versionsnummer
#   (dann legt der Workflow den Tag auf dem gewählten Stand selbst an).
# Das Release enthält nur dieses Repository (Build-Skript + Firefox-Shims),
# keine gebaute .xpi – die würde Code von Anthropic enthalten.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne "v", z. B. 0.1.0 (muss in CHANGELOG.md stehen)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Version bestimmen
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then version="${INPUT_VERSION#v}"; else version="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Ungültige Version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Release-Notizen aus CHANGELOG.md lesen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Kein Abschnitt für $VERSION in CHANGELOG.md gefunden." >&2
            exit 1
          fi
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "Claude-Firefox $TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
