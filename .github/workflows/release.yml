name: Release

# Erstellt ein GitHub-Release, sobald ein Tag wie v0.1.0 gepusht wird.
# Das Release enthält nur dieses Repository (Build-Skript + Firefox-Shims),
# keine gebaute .xpi – die würde Code von Anthropic enthalten.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Release-Notizen aus CHANGELOG.md lesen
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Kein Abschnitt für $version in CHANGELOG.md gefunden." >&2
            exit 1
          fi
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Claude-Firefox $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
